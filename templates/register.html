<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Support System - Create Account</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <main class="login-container">

        <section class="login-card register-card">

            <div class="login-header">

                <h1>Create an Account</h1>

            </div>


            <!-- REGISTRATION FORM -->

            <form id="registerForm">

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="primary-button"
                    id="registerButton"
                >
                    Create Account
                </button>


                <p
                    id="registerMessage"
                    class="message"
                    aria-live="polite"
                ></p>

            </form>


            <!-- BACK TO LOGIN -->

            <div class="register-section">

                <p class="register-text">
                    Already have an account?
                </p>

                <button
                    type="button"
                    class="secondary-button register-button"
                    onclick="window.location.href='/'"
                >
                    Back to Login
                </button>

            </div>

        </section>

    </main>


    <script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
